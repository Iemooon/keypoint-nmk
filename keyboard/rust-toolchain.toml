# The firmware on the keyboard was built and tested with this exact compiler.
#
# CI has to agree byte for byte, or a green check says nothing about the image you
# can actually flash: the first workflow run used the runner's fresh `stable`
# (1.98.1) against a development machine on 1.98.0 and every image came out
# different - same flash spans, same behaviour, different bytes, because a patch
# release changes codegen. Pinning the channel makes "built by CI" mean "the same
# firmware".
[toolchain]
channel = "1.98.0"
# rustup installs these automatically when cargo is run in this directory, which
# is what keeps a fresh clone working. Do not rely on a previously installed
# `stable`: the pinned channel is a SEPARATE toolchain, and without this line a
# first build there fails with E0463 "can't find crate for `core`" - the target's
# core/alloc are simply not present. Verified the hard way on the development
# machine on 2026-09-29, where pinning the channel silently broke local builds.
targets = ["thumbv7em-none-eabihf"]
# Same per-toolchain rule: `cargo objcopy` / `cargo size` come from llvm-tools,
# and the build scripts (and tools/voltage-sweep.py) call them. Without this the
# compile succeeds and only the image conversion fails - "Could not find tool:
# objcopy" - which is easy to misread as a broken build script.
components = ["llvm-tools"]
